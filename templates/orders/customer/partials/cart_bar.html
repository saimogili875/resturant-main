{% load currency %}
{% if cart_count > 0 %}
<div class="fixed-bottom-bar">
  <div class="app-container flex justify-between items-center" style="padding: 0;">
    <div>
      <span class="text-lg text-bold text-primary">{{ cart_count }} item{% if cart_count != 1 %}s{% endif %}</span>
      <div class="text-sm text-bold" style="color: var(--color-brand-primary);">Est. Total: {{ cart_total|money }}</div>
    </div>
    <a 
      href="{% url 'orders_customer:checkout' %}"
      class="btn btn-primary">
      Proceed to Checkout &rarr;
    </a>
  </div>
</div>
{% else %}
<div class="fixed-bottom-bar">
  <div class="app-container flex justify-between items-center" style="padding: 0; justify-content: center;">
    <div class="text-muted text-sm text-center">
      Select items from the delivery menu below to get started
    </div>
  </div>
</div>
{% endif %}
