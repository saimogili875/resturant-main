<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Delivery Order{% endblock %} — RDH · Cafe Rudra</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/design-tokens.css' %}">
  <!-- Open Graph / Social Media Preview -->
  <meta property="og:title" content="Cafe Rudra — Named After the Storm" />
  <meta property="og:description" content="Golden string lights, a black double-decker frame, and the calm after the storm. Come sit, sip, and stay a while." />
  <meta property="og:image" content="https://www.rdhcafe.in/static/images/share-preview.jpg" />
  <meta property="og:url" content="https://www.rdhcafe.in" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cafe Rudra — Named After the Storm" />
  <meta name="twitter:description" content="Golden string lights, a black double-decker frame, and the calm after the storm." />
  <meta name="twitter:image" content="https://www.rdhcafe.in/static/images/share-preview.jpg" />

  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="app-header__title">RDH · Cafe Rudra</h1>
      <span class="app-header__subtitle">Fast Doorstep Delivery</span>
    </div>
    <div class="flex items-center gap-2">
      {% include "partials/share_modal.html" %}
      {% if delivery_customer %}
        <a href="{% url 'orders_customer:my_orders' %}" class="btn btn-xs btn-outline" style="border-color: var(--color-brand-primary); color: var(--color-brand-primary); padding: 0.35rem 0.65rem; border-radius: var(--radius-sm); font-weight: 600;">
          📦 My Orders
        </a>
        <span class="text-xs text-muted" title="{{ delivery_customer.email }}">
          {{ delivery_customer.email|truncatechars:18 }}
        </span>
        <a href="{% url 'customer_auth:logout' %}" class="btn btn-xs btn-outline">Logout</a>
      {% else %}
        <a href="{% url 'customer_auth:login' %}" class="btn btn-xs btn-outline">Sign In</a>
      {% endif %}
      <div class="table-badge">
        Delivery
      </div>
    </div>
  </header>

  <main class="container" id="main-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
