{% load static %}
<!-- Share Website Component (Alpine.js) -->
<div x-data="{
  open: false,
  copied: false,
  title: 'Cafe Rudra — Named After the Storm',
  text: 'Golden string lights, a black double-decker frame, and the calm after the storm. Come sit, sip, and stay a while.',
  url: window.location.origin + window.location.pathname,
  openModal() {
    this.open = true;
  },
  closeModal() {
    this.open = false;
  },
  copyLink() {
    navigator.clipboard.writeText(this.url).then(() => {
      this.copied = true;
      setTimeout(() => { this.copied = false; }, 2500);
    }).catch(() => {
      this.copied = true;
      setTimeout(() => { this.copied = false; }, 2500);
    });
  }
}">
  <!-- Share Button in Header -->
  <button type="button" @click="openModal()" class="btn btn-xs btn-outline inline-flex items-center gap-1.5 glow-hover" title="Share Website" style="display: inline-flex; align-items: center; gap: 0.35rem; border-color: var(--color-brand-primary); color: var(--color-brand-primary); padding: 0.35rem 0.65rem; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer;">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
    </svg>
    <span>Share Website</span>
  </button>

  <!-- Share Modal Dialog -->
  <template x-teleport="body">
    <div x-show="open" x-cloak class="share-modal-overlay">
      <div @click.outside="closeModal()" class="card card-body w-full max-w-sm" style="background: var(--rdh-surface-container); border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-lg); padding: 1.25rem; color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-width: 380px; width: 100%; position: relative; z-index: 10000;">
        
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
          <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--color-brand-primary); display: flex; align-items: center; gap: 0.4rem;">
            <span>✨ Share Cafe Rudra</span>
          </h3>
          <button type="button" @click="closeModal()" style="background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; padding: 0.25rem; line-height: 1;">&times;</button>
        </div>

        <!-- Image Card Preview inside Share Modal -->
        <div style="margin-bottom: 1rem; border-radius: var(--radius-md); overflow: hidden; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6);">
          <img src="{% static 'images/share-preview.jpg' %}" alt="Cafe Rudra — Share Preview" style="width: 100%; height: 170px; object-fit: cover; display: block;">
          <div style="padding: 0.75rem;">
            <div style="font-size: 0.85rem; font-weight: 700; color: var(--color-brand-primary);">Cafe Rudra — Named After the Storm</div>
            <div style="font-size: 0.75rem; color: #ccc; margin-top: 0.25rem; line-height: 1.3;">
              Golden string lights, a black double-decker frame, and the calm after the storm. Come sit, sip, and stay a while.
            </div>
          </div>
        </div>

        <!-- Social Share Buttons Grid -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem;">
          <!-- WhatsApp -->
          <a :href="'https://api.whatsapp.com/send?text=' + encodeURIComponent(title + ' - ' + text + ' ' + url)" target="_blank" class="btn btn-sm" style="background: #25D366; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem;">
            📱 WhatsApp
          </a>

          <!-- Twitter / X -->
          <a :href="'https://twitter.com/intent/tweet?text=' + encodeURIComponent(title + ' - ' + text) + '&url=' + encodeURIComponent(url)" target="_blank" class="btn btn-sm" style="background: #1DA1F2; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem;">
            🐦 Twitter / X
          </a>

          <!-- Facebook -->
          <a :href="'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url)" target="_blank" class="btn btn-sm" style="background: #1877F2; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem;">
            📘 Facebook
          </a>

          <!-- Telegram -->
          <a :href="'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(title + ' - ' + text)" target="_blank" class="btn btn-sm" style="background: #229ED9; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem;">
            ✈️ Telegram
          </a>
        </div>

        <!-- Copy Direct Link Box -->
        <div style="background: rgba(255,255,255,0.05); padding: 0.5rem 0.75rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between;">
          <input type="text" :value="url" readonly style="background: none; border: none; color: #ddd; font-size: 0.75rem; width: 70%; outline: none;">
          <button type="button" @click="copyLink()" class="btn btn-xs btn-primary" style="padding: 0.35rem 0.6rem; font-size: 0.75rem; border-radius: var(--radius-sm); cursor: pointer;">
            <span x-text="copied ? 'Copied!' : 'Copy Link'"></span>
          </button>
        </div>

      </div>
    </div>
  </template>
</div>
